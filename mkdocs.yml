site_name: UseGalaxy.EU Operations
site_description: Operations Manual for usegalaxy.eu
site_url: https://usegalaxy-eu.github.io/operations/
repo_url: https://github.com/usegalaxy-eu/operations
repo_name: usegalaxy-eu/operations
edit_uri: edit/main/

site_dir: site

theme:
  name: material
  variant: classic
  features:
    - content.code.copy
    - navigation.expand
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - search.highlight
    - search.share
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - sane_lists
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

